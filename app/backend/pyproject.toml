[project]
name = "papertrail"
version = "0.1.0"
description = "Research paper discovery and verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
