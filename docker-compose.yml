services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
      POSTGRES_DB: papertrail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrail -d papertrail"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./app/backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://papertrail:papertrail@db:5432/papertrail
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  pgdata:
